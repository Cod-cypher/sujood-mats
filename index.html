<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js). Hits queue in dataLayer straight away; the 170 KB library
         itself loads on first interaction or 5s after load, so it never delays first paint.
         Keep in sync with src/seo/layout.ts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-5XDYZ75YQF');
      (function () {
        var done = false, events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function load() {
          if (done) return;
          done = true;
          events.forEach(function (e) { removeEventListener(e, load); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5XDYZ75YQF';
          document.head.appendChild(s);
        }
        events.forEach(function (e) { addEventListener(e, load, { passive: true, once: true }); });
        addEventListener('load', function () { setTimeout(load, 5000); });
      })();
    </script>

    <link rel="icon" type="image/png" href="/favicon-64.png" />

    <!-- The hero photo is the LCP element: fetch it first. Keep imagesizes in sync
         with HERO_IMAGE_SIZES in src/App.tsx. -->

      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      imagesrcset="/images/rawdah_mat_1782347244248-480.webp 480w, /images/rawdah_mat_1782347244248-720.webp 720w, /images/rawdah_mat_1782347244248-1200.webp 1200w"

    />
